[project]
name = "nfl-simulation"
version = "0.1.0"
description = "NFL play-by-play game simulator and live game companion (split out of floormodel)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=2.1",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
hosted = ["boto3>=1.36"]  # the R2 publisher (nflsim worker --publish r2)
kalshi = ["cryptography>=50.0.2", "websockets>=17.3"]  # Kalshi's WebSocket feed (KALSHI_* env vars)

[project.scripts]
nflsim = "nflsim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "boto3>=1.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nflsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the simulator (needs data/ and the season set-up cache)"]
