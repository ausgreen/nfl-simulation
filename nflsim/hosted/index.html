<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Game Companion</title>
<style>
:root {
  --bg: #f4f5f2; --surface: #ffffff; --ink: #18211c; --ink-2: #4a554e; --ink-3: #7b857f;
  --rule: #d9ddd8; --rule-2: #eceee9; --accent: #1d6b48; --accent-wash: #e3f0e8; --warn: #9a5b00; --warn-wash: #fff3dc;
  --bar: #1d6b48; --bar-2: #c9d9cf; --link: #1a5c9e;
  --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #161e1a; --ink: #e6ece8; --ink-2: #b2bcb6; --ink-3: #7f8a84;
    --rule: #2a3530; --rule-2: #212b26; --accent: #4fb582; --accent-wash: #1c3327; --warn: #f5c34f; --warn-wash: #3a2f12;
    --bar: #4fb582; --bar-2: #2c3d34; --link: #7cc4ff;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #161e1a; --ink: #e6ece8; --ink-2: #b2bcb6; --ink-3: #7f8a84;
  --rule: #2a3530; --rule-2: #212b26; --accent: #4fb582; --accent-wash: #1c3327; --warn: #f5c34f; --warn-wash: #3a2f12;
  --bar: #4fb582; --bar-2: #2c3d34; --link: #7cc4ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
.app { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
header.site { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 20px; border-bottom: 1px solid var(--rule); }
.brand { font-size: 18px; font-weight: 700; letter-spacing: .02em; padding-bottom: 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs a { padding: 8px 12px; color: var(--ink-2); text-decoration: none; font-weight: 600; white-space: nowrap;
  border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@keyframes flash { from { background-color: var(--warn-wash); } }
.flash { animation: flash 1.6s ease-out; }
.beat { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); align-self: center; margin-left: auto; }
.beat.flash { animation: beat 1.6s ease-out; }
@keyframes beat { from { background: var(--accent); box-shadow: 0 0 0 5px var(--accent-wash); } }
header.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
h2 { margin: 6px 0 0; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.muted { color: var(--ink-3); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px;
  color: inherit; text-decoration: none; }
.card:hover { border-color: var(--ink-3); }
.card.live { border-left: 4px solid var(--accent); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.teams { font: 700 20px var(--mono); }
.teams .has { box-shadow: inset 0 -3px 0 var(--accent); }
.status { font-size: 12.5px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.status .live-tag { color: var(--accent); font-weight: 700; letter-spacing: .05em; }
.sit { font-weight: 600; }
.last { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--bar-2); }
.wp i { background: var(--bar); }
.wp-lbl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }
.qbs { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--rule-2); padding-top: 6px; }
.badge { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11.5px; background: var(--warn-wash); color: var(--warn); }
.stale { background: var(--warn-wash); color: var(--warn); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; }
.stale[hidden] { display: none; }
.err { color: var(--warn); }
footer { color: var(--ink-3); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <header class="site">
    <span class="brand">Live Game Companion</span>
    <nav class="tabs" aria-label="Pages"><a href="./" aria-current="page">All games</a><a href="game.html">Game</a><a href="edges.html">Model vs Kalshi</a></nav>
    <span class="beat" id="beat" title="Pulses when new numbers arrive"></span>
  </header>
  <header class="top">
    <h1>This week</h1>
    <span class="muted" id="updated"></span>
  </header>
  <div class="stale" id="stale" role="status" hidden></div>
  <main id="games" aria-live="polite"><span class="muted">Loading this week's games…</span></main>
  <footer>Updated from ESPN's live feed, which runs a few seconds behind TV. For information only.</footer>
</div>

<script>
(() => {
  const SUMMARY = "summary.json", GAME = "game.html", EVERY_S = 10, STALE_S = 60, STATS_S = 2 * 86400;
  const asked = new URLSearchParams(location.search).get("event");  // an old link to a game's page
  if (asked) location.replace(`${GAME}?event=${encodeURIComponent(asked)}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pct = (x) => x == null ? "—" : Math.round(x * 100) + "%";
  const ago = (s) => s < 120 ? `${Math.round(s)} s` : s < 7200 ? `${Math.round(s / 60)} min` : s < 172800 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 86400)} days`;
  const getJSON = async (path) => {
    const r = await fetch(path, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.statusText);
    return r.json();
  };
  const kickoff = (t) => new Date(t).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  const last = (n) => String(n || "").split(" ").slice(1).join(" ") || n;

  // a cue when new numbers arrive: what changed flashes, and the dot in the tab bar pulses
  const seen = new Map();
  const restart = (el) => { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); };
  function cue(...selectors) {
    let changed = false;
    for (const sel of selectors) document.querySelectorAll(sel).forEach((el, i) => {
      const key = `${sel}|${el.dataset.key || i}`, html = el.innerHTML;
      if (seen.has(key) && seen.get(key) !== html) { restart(el); changed = true; }
      seen.set(key, html);
    });
    if (changed) restart($("beat"));
  }

  function card(g) {
    const live = g.state === "in", done = g.state === "post";
    const as = g.score ? g.score.away : g.awayScore, hs = g.score ? g.score.home : g.homeScore;
    const side = (t, sc) => `<span${g.ball && g.ball.team === t ? ` class="has" title="${esc(t)} has the ball"` : ""}>${esc(t)}${g.state === "pre" ? "" : " " + sc}</span>`;
    const status = live ? `<span class="live-tag">LIVE</span> · ${esc(g.detail)}` : done ? esc(g.detail) : esc(kickoff(g.kickoff));
    const line = g.line && g.line.spread != null
      ? `${esc(g.home)} ${g.line.spread > 0 ? "−" + g.line.spread : "+" + Math.abs(g.line.spread)} · total ${g.line.total}` : "";
    const sit = live ? `<div class="sit">${esc(g.ball ? `${g.ball.team} ${g.ball.kick ? "receives · kickoff next" : "ball · " + g.ball.situation}` : g.now)}</div>
        <div class="last">${esc(g.lastPlay || "")}</div>` : done || !line ? "" : `<div class="muted">${line}</div>`;
    let wp = "";
    if (g.homeWin != null && !done) {
      const aw = 1 - g.homeWin;
      wp = `<div><div class="wp" title="Win chance"><i style="width:${(aw * 100).toFixed(1)}%"></i></div>
        <div class="wp-lbl"><span>${esc(g.away)} win <b class="num">${pct(aw)}</b></span>
        <span class="num">proj ${Math.round(g.final.away)}–${Math.round(g.final.home)}</span>
        <span>${esc(g.home)} win <b class="num">${pct(g.homeWin)}</b></span></div></div>`;
    } else if (g.homeWin == null && !done) {
      wp = `<div class="muted">No projection yet.</div>`;
    }
    const qbs = (g.qbs || []).map((q) => {
      const name = `${esc(last(q.qb) || q.team)} <span class="muted">${esc(q.team)}</span>${q.out ? ` <span class="badge">may be out</span>` : ""}`;
      const proj = done ? "" : g.state === "pre" ? ` · median <b class="num">${Math.round(q.median)}</b> (${Math.round(q.p10)}–${Math.round(q.p90)})`
        : ` → median <b class="num">${Math.round(q.median)}</b> (${Math.round(q.p10)}–${Math.round(q.p90)})`;
      return `<div>${name}: ${g.state === "pre" ? "" : `<b class="num">${Math.round(q.yds)}</b> yds`}${proj}</div>`;
    }).join("");
    return `<a class="card${live ? " live" : ""}" data-key="${esc(g.event)}" href="${GAME}?event=${encodeURIComponent(g.event)}">
      <div class="row"><span class="teams">${side(g.away, as)} – ${side(g.home, hs)}</span><span class="status">${status}</span></div>
      ${sit}${wp}${qbs ? `<div class="qbs">${qbs}</div>` : ""}</a>`;
  }

  function render(cards) {
    const groups = [["Live", cards.filter((g) => g.state === "in")],
                    ["Upcoming", cards.filter((g) => g.state === "pre").sort((a, b) => a.kickoff.localeCompare(b.kickoff))],
                    ["Final", cards.filter((g) => g.state === "post")]];
    $("games").innerHTML = groups.filter(([, gs]) => gs.length)
      .map(([name, gs]) => `<h2>${name} <span class="muted">${gs.length}</span></h2><div class="cards">${gs.map(card).join("")}</div>`).join("")
      || `<span class="muted">No games this week.</span>`;
  }

  let busy = false;  // the local server can take a while to answer
  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const [cards, st] = await Promise.all([getJSON(SUMMARY), getJSON("status.json").catch(() => null)]);
      render(cards);
      cue(".card");
      $("updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
      const behind = st ? (Date.now() - Date.parse(st.updated)) / 1000 : 0;
      const limit = st ? Math.max(STALE_S, 2.5 * (st.every || 0)) : Infinity;
      const stats = st && st.data && st.data.stats ? (Date.now() - Date.parse(st.data.stats)) / 1000 : 0;
      $("stale").hidden = behind <= limit && stats <= STATS_S;
      $("stale").textContent = behind > limit ? `Updates have paused: the last check of ESPN's feed was ${ago(behind)} ago. Numbers may be out of date.`
        : `Player stats were last updated ${ago(stats)} ago; pregame numbers may be out of date.`;
    } catch (e) {
      $("updated").innerHTML = `<span class="err">Update failed: ${esc(e.message)}</span>`;
    } finally { busy = false; }
  }

  refresh();
  setInterval(refresh, EVERY_S * 1000);
})();
</script>
</body>
</html>
